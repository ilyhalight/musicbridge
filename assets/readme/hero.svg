<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">MusicBridge</title>
  <desc id="hero-desc">Three music player cards on the left feed the MusicBridge node in the middle, which publishes the playing one as a media widget with track info and transport controls on the right. Playback commands flow back to the player.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#FF9230"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="28" fill="#0A0A0B"/>
  <rect x="1" y="1" width="1198" height="438" rx="27" fill="none" stroke="#2B2620" stroke-width="2"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#FF9230">ANDROID · MEDIA SESSION MIRROR</text>
    <text x="52" y="168" font-size="76" font-weight="800" letter-spacing="-1.5" fill="#F4EDE6">MusicBridge</text>
    <g font-size="28" fill="#D9CFC4">
      <text x="56" y="228">Show any music player on</text>
      <text x="56" y="266">the lock screen, Quick Settings</text>
      <text x="56" y="304">and Dynamic Island of your ROM.</text>
    </g>
    <text x="56" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#A89D91">Android 10+ · Kotlin · Jetpack Compose</text>
  </g>

  <g id="mechanism" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="560" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1" fill="#A89D91">PLAYERS</text>
    <text x="900" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1" fill="#A89D91">SYSTEM WIDGET</text>

    <g id="player-cards">
      <g transform="translate(560 120)">
        <rect width="166" height="64" rx="18" fill="#141210" stroke="#2B2620" stroke-width="2"/>
        <rect x="20" y="22" width="6" height="20" rx="2" fill="#6F665D"/>
        <rect x="31" y="22" width="6" height="20" rx="2" fill="#6F665D"/>
        <text x="54" y="40" font-size="22" fill="#A89D91">Spotify</text>
      </g>
      <g transform="translate(560 204)">
        <rect width="166" height="64" rx="18" fill="#141210" stroke="#2B2620" stroke-width="2"/>
        <rect x="20" y="22" width="6" height="20" rx="2" fill="#6F665D"/>
        <rect x="31" y="22" width="6" height="20" rx="2" fill="#6F665D"/>
        <text x="54" y="40" font-size="22" fill="#A89D91">Any player</text>
      </g>
      <g transform="translate(560 288)">
        <rect width="166" height="64" rx="18" fill="#1F1710" stroke="#FF9230" stroke-width="2"/>
        <rect x="20" y="32" width="6" height="12" rx="2" fill="#FF9230"/>
        <rect x="30" y="20" width="6" height="24" rx="2" fill="#FF9230"/>
        <rect x="40" y="27" width="6" height="17" rx="2" fill="#FF9230"/>
        <text x="62" y="40" font-size="22" font-weight="600" fill="#F4EDE6">VK X</text>
      </g>
    </g>

    <g id="session-flow" fill="none" stroke-linecap="round">
      <path d="M726 152 C752 152 750 236 768 236" stroke="#3A332B" stroke-width="3" stroke-dasharray="3 8"/>
      <path d="M726 236 L768 236" stroke="#3A332B" stroke-width="3" stroke-dasharray="3 8"/>
      <path d="M726 320 C752 320 750 236 768 236" stroke="#FF9230" stroke-width="4"/>
      <path d="M846 236 L890 236" stroke="#FF9230" stroke-width="4" marker-end="url(#arrow-orange)"/>
    </g>

    <g id="bridge-node" transform="translate(806 236)">
      <circle r="38" fill="#FF9230"/>
      <path d="M-24 11 H24" stroke="#0A0A0B" stroke-width="5" stroke-linecap="round"/>
      <path d="M-20 11 Q0 -24 20 11" fill="none" stroke="#0A0A0B" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 -6 V11 M-10 -1 V11 M10 -1 V11" stroke="#0A0A0B" stroke-width="3" stroke-linecap="round"/>
      <text x="-30" y="86" font-size="20" font-weight="600" fill="#F4EDE6">MusicBridge</text>
    </g>

    <g id="media-widget" transform="translate(900 120)">
      <rect width="244" height="170" rx="40" fill="#000000" stroke="#FF9230" stroke-width="2"/>
      <rect x="24" y="24" width="60" height="60" rx="16" fill="#FF9230"/>
      <circle cx="54" cy="54" r="18" fill="none" stroke="#0A0A0B" stroke-width="4"/>
      <circle cx="54" cy="54" r="4" fill="#0A0A0B"/>
      <text x="98" y="48" font-size="22" font-weight="700" fill="#F4EDE6">Track title</text>
      <text x="98" y="76" font-size="20" fill="#A89D91">Artist name</text>
      <rect x="24" y="106" width="196" height="6" rx="3" fill="#2B2620"/>
      <rect x="24" y="106" width="84" height="6" rx="3" fill="#FF9230"/>
      <g fill="#F4EDE6">
        <path d="M62 128 H65 V152 H62 Z M84 128 L66 140 L84 152 Z"/>
        <rect x="112" y="128" width="7" height="24" rx="2"/>
        <rect x="125" y="128" width="7" height="24" rx="2"/>
        <path d="M160 128 L178 140 L160 152 Z M179 128 H182 V152 H179 Z"/>
      </g>
    </g>

    <g id="command-return" fill="none" stroke-linecap="round">
      <path d="M1022 290 V372 H643 V360" stroke="#FF9230" stroke-width="3" stroke-dasharray="3 9" marker-end="url(#arrow-orange)"/>
    </g>
    <text x="832" y="408" text-anchor="middle" font-size="20" fill="#A89D91">play, pause and skip go back to the player</text>
  </g>
</svg>
